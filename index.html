<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Siobhan Frost</title>
<meta name="description" content="Siobhan Frost" />
<link rel="preload" as="image" href="interact/assets/name/S.webp">
<style>
/* Same placement as /interact: the balloon name rests on the bottom-left of the browser. */
:root{--floor-x:max(10px,.9vw);--spring:cubic-bezier(.34,1.45,.5,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#fff;overflow:hidden}
.stage{position:relative;width:100%;height:100vh;height:100svh;min-height:540px;overflow:hidden}
.name{position:absolute;left:var(--floor-x);bottom:0;display:flex;align-items:flex-end;flex-wrap:nowrap;pointer-events:none;font-size:0}
.name .gap{flex:none}
.ltr{flex:none;position:relative;pointer-events:auto;cursor:default}
.ltr .rise{display:block;transform:translateY(130%);animation:rise 1.5s var(--spring) forwards}
.ltr .bob{display:block;transform-origin:50% 100%;animation:bob var(--d,6s) ease-in-out var(--dl,0s) infinite alternate}
.ltr img{display:block;width:100%;height:auto;transform-origin:50% 92%;transform:translateY(var(--sink,0%)) rotate(var(--rot,0deg));transition:transform .9s var(--spring);user-select:none;-webkit-user-drag:none}
.ltr:hover img{transform:translateY(calc(var(--sink,0%) - 7%)) rotate(calc(var(--rot,0deg) * -.6)) scale(1.04)}
@keyframes rise{to{transform:translateY(0)}}
@keyframes bob{
  0%{transform:translate(0,0) rotate(0deg)}
  50%{transform:translate(var(--dx,1px),var(--dy,-6px)) rotate(var(--r1,.8deg))}
  100%{transform:translate(calc(var(--dx,1px) * -1),calc(var(--dy,-6px) * .7)) rotate(var(--r2,-.6deg))}
}
@media (max-width:760px){
  .name{width:calc(100vw - var(--floor-x) * 2)}
  .name .sur,.name .gap{display:none}   /* phones show 'Siobhan' only, as on /interact */
}
@media (prefers-reduced-motion:reduce){.ltr .rise,.ltr .bob{animation:none;transform:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <h1 class="name" id="name" aria-label="Siobhan Frost"></h1>
</main>
<script>
(() => {
  // [file, width, height, tilt, sink %] — identical to /interact
  const SMALL = {o:.84, r:.84, o2:.84, s:.84, t:.84};
  const LETTERS = [
    ['S',362,341,-2,0.59],['i',141,345,3,1.54],['o',306,332,-1.5,1.35],['b',271,340,2,1.72],['h',298,346,-1,0.93],['a',282,318,3.5,2.06],['n',281,310,-2,0.4],
    'br',
    ['F',321,379,-3,-0.1],['r',311,338,-4,-0.74],['o2',376,360,5,1.61],['s',362,377,-6,-0.73],['t',331,376,7,1.3],
  ];
  const stage = document.getElementById('stage'), nameEl = document.getElementById('name');
  const letterEls = [];
  let k = 0, sur = false;
  LETTERS.forEach(L => {
    if (L === 'br'){ sur = true; const g = document.createElement('span'); g.className = 'gap'; nameEl.appendChild(g); return; }
    const [key,w,h,rot,sink] = L;
    const s = document.createElement('span');
    s.className = 'ltr' + (sur ? ' sur' : '');
    s.dataset.w = w * (SMALL[key] || 1);
    s.style.setProperty('--rot', rot+'deg');
    s.style.setProperty('--sink', sink+'%');
    s.style.setProperty('--d', (5.2 + (k*1.37)%3.1).toFixed(2)+'s');
    s.style.setProperty('--dl', (-(k*0.83)%5).toFixed(2)+'s');
    s.style.setProperty('--dx', ((k%2?1:-1)*(1+k%3))+'px');
    s.style.setProperty('--dy', (-(4 + (k*7)%5))+'px');
    s.style.setProperty('--r1', ((k%2?1:-1)*(0.6+(k%3)*0.4)).toFixed(2)+'deg');
    s.style.setProperty('--r2', ((k%2?-1:1)*(0.5+(k%4)*0.3)).toFixed(2)+'deg');
    s.innerHTML = `<span class="rise" style="animation-delay:${(0.35 + k*0.07).toFixed(2)}s"><span class="bob"><img src="interact/assets/name/${key}.webp" alt="" draggable="false"></span></span>`;
    nameEl.appendChild(s); letterEls.push(s); k++;
  });
  const OVERLAP = 0.16;
  const SUM1 = 362+141+306*.84+271+298+282+281, SUM2 = 321+(311+376+362+331)*.84;
  function layout(){
    const W = stage.clientWidth, H = stage.clientHeight, mobile = W <= 760;
    const u = !mobile ? Math.min(W*0.85/((SUM1+SUM2)*(1-OVERLAP) + 120), H*0.185/345)
                      : Math.min((W-28)*0.98/(SUM1*(1-OVERLAP) + 362*OVERLAP), H*0.16/345);
    letterEls.forEach(s => { const w = +s.dataset.w * u; s.style.width = w+'px'; s.style.marginRight = (-w*OVERLAP)+'px'; });
    nameEl.querySelector('.gap').style.width = (120*u)+'px';
  }
  layout(); addEventListener('resize', layout);
})();
</script>
  <script data-goatcounter="https://siobhanfrost.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
